name: Android CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Create Mock env file
      run: cp .env.example .env

    - name: Build Release APK
      run: gradle assembleRelease --stacktrace

    - name: Run Tests
      run: gradle testDebugUnitTest

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: app/build/outputs/apk/release/app-release-unsigned.apk

    - name: Build Docker Container
      run: docker build -t smart-media-manager .

    - name: Test Docker Container (Port 3000 & Log)
      run: |
        docker run -d -p 3000:3000 --name smm-container smart-media-manager
        sleep 5
        curl -f http://localhost:3000 || exit 1
        docker exec smm-container cat /app/app.log | grep "Docker container built" || exit 1
        docker stop smm-container
